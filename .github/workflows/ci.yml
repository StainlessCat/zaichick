name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: zaychick_test
          POSTGRES_USER: zaychick
          POSTGRES_PASSWORD: zaychick_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/pyproject.toml'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Lint Check
        working-directory: ./backend
        run: |
          ruff check .

      - name: Run Database Migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://zaychick:zaychick_test_password@localhost:5432/zaychick_test
          JWT_SECRET_KEY: test-secret-key-32-bytes-minimum-length!
        run: |
          alembic upgrade head

      - name: Run Backend Pytest
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://zaychick:zaychick_test_password@localhost:5432/zaychick_test
          JWT_SECRET_KEY: test-secret-key-32-bytes-minimum-length!
          ENVIRONMENT: test
        run: |
          pytest app/tests -v --tb=short

  frontend:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check (TypeScript)
        run: npm run lint

      - name: Run Frontend Tests
        run: npm test

      - name: Build production bundle
        run: npm run build
