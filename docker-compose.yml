# =========================================================================
# Корпоративное развёртывание ZAYCHICK 2.0 (FastAPI + PostgreSQL + React)
# Запуск: docker compose up -d --build
# Остановка: docker compose down
# Логи: docker compose logs -f
# =========================================================================

services:
  # 1. Реляционная база данных PostgreSQL 16
  db:
    image: postgres:16-alpine
    container_name: zaychick_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zaychick}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zaychick_secure_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-zaychick}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-zaychick} -d $${POSTGRES_DB:-zaychick}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # 2. Высокопроизводительный асинхронный Backend (FastAPI + Uvicorn)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: zaychick_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-zaychick}:${POSTGRES_PASSWORD:-zaychick_secure_dev_password}@db:5432/${POSTGRES_DB:-zaychick}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-secret-key-in-production-min-32-bytes}
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      COOKIE_NAME: zaychick_access_token
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: lax
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost,http://127.0.0.1}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 3. Web-сервер и Reverse Proxy (Nginx + собранный SPA в /usr/share/nginx/html)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    container_name: zaychick_web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
    name: zaychick_postgres_data
